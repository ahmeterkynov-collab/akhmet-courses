    let currentLang = localStorage.getItem('lms_lang') || 'ru';
    let currentTheme = localStorage.getItem('lms_theme') || 'dark';

    let userRole = 'student';
    let userFullName = '';

    let currentCoursesList = [];
    let userProgressMap = {};
    let allStudentsData = [];
    
    // Централизованное состояние для корректной навигации без сбросов
    let navigationState = { view: 'auth', courseId: null, lessonId: null };

    function initTheme() {
      const body = document.body;
      const icon = document.getElementById('theme-icon');
      if (currentTheme === 'light') {
        body.className = 'theme-light min-h-screen flex flex-col no-select transition-colors duration-300';
        if (icon) icon.className = 'fa-solid fa-sun text-xs sm:text-sm text-amber-400';
      } else {
        body.className = 'theme-dark min-h-screen flex flex-col no-select transition-colors duration-300';
        if (icon) icon.className = 'fa-solid fa-moon text-xs sm:text-sm';
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('lms_theme', currentTheme);
      initTheme();
    }

    // ИСПРАВЛЕНИЕ #1: Мгновенное обновление текстов без потери активной страницы
    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lms_lang', lang);
      updateLanguageUI();
      
      if (!currentUser) {
         renderAuthView(); // Если мы на экране входа, просто перерисовываем его
         return;
      }

      if (navigationState.view === 'courses') {
         renderCoursesHTML(); // Только отрисовка HTML, без запросов в БД
      } else if (navigationState.view === 'course-detail' && navigationState.courseId) {
         const hasAccess = userRole === 'admin' || !!userCourseAccessMap[navigationState.courseId];
         if (!hasAccess && userRole !== 'admin') {
             renderLockedCourseView(navigationState.courseId, document.getElementById('app-content'));
         } else {
             let activeLesson = currentCourseLessons[0];
             if (navigationState.lessonId) {
                 const found = currentCourseLessons.find(l => l.id === navigationState.lessonId);
                 if (found) activeLesson = found;
             }
             if (activeLesson) {
                 renderLessonDetailsView(activeLesson, navigationState.courseId, document.getElementById('app-content'));
             } else {
                 openCourse(navigationState.courseId, false); // Если уроков нет в памяти, грузим заново
             }
         }
      }
    }

      document.getElementById('txt-reset-send').innerText = i18n[currentLang].send;

            </button>

            </button>

    function initSupabase() {
      const url = localStorage.getItem('supabase_url') || DEFAULT_SUPABASE_URL;
      const key = localStorage.getItem('supabase_key') || DEFAULT_SUPABASE_KEY;

      if (url && key && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(url, key);
          checkAuthStatus();
        } catch (e) {
          console.error("Supabase init error:", e);
        }
      }
    }

    // ИСПРАВЛЕНИЕ #2: Защита прав администратора для владельца
    async function checkAuthStatus() {
      if (!supabaseClient) return;

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentUser = session.user;
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('role, full_name')
            .eq('id', currentUser.id)
            .maybeSingle();

          let dbRole = profile?.role;
          
          // Принудительная выдача прав админа владельцу почты
          // Это решает проблему, когда RLS политики Supabase блокируют чтение своей роли
          if (currentUser.email === 'ahmet.erkynov@gmail.com') {
              dbRole = 'admin';
          }

          userRole = dbRole || 'student';
          userFullName = profile?.full_name || currentUser.email.split('@')[0];

          await loadUserAccess();
          await loadUserProgress();
          updateUserMenu(userFullName);
          
          // Переход на курсы после входа
          renderCoursesView();
        } else {
          currentUser = null;
          updateUserMenu(null);
          renderAuthView();
        }
      } catch(err) {
        console.error("Auth check failed:", err);
      }
    }

    async function loadUserAccess() {
      if (!currentUser || !supabaseClient) return;
      userCourseAccessMap = {};
      if (userRole === 'admin') return;

      const { data } = await supabaseClient
        .from('course_access')
        .select('course_id, expires_at')
        .eq('user_id', currentUser.id);

      if (data) {
        const now = new Date();
        data.forEach(acc => {
          if (!acc.expires_at || new Date(acc.expires_at) > now) {
            userCourseAccessMap[acc.course_id] = acc.expires_at;
          }
        });
      }
    }

    async function loadUserProgress() {
      if (!currentUser || !supabaseClient) return;
      const { data } = await supabaseClient
        .from('lesson_progress')
        .select('lesson_id, completed')
        .eq('user_id', currentUser.id);

      userProgressMap = {};
      if (data) {
        data.forEach(p => { if (p.completed) userProgressMap[p.lesson_id] = true; });
      }
    }

    function updateUserMenu(name) {
      const menu = document.getElementById('user-menu');
      const dbBtn = document.getElementById('db-config-btn');

      if (name) {
        menu.classList.remove('hidden');
        document.getElementById('user-name').innerText = name;
        document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
        
        const badge = document.getElementById('user-role-badge');
        if (userRole === 'admin') {
          badge.innerText = i18n[currentLang].adminRole;
          badge.className = 'text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full font-bold uppercase bg-blue-600/20 text-blue-400 border border-blue-500/40';
          if (dbBtn) dbBtn.classList.remove('hidden');
        } else {
          badge.innerText = i18n[currentLang].studentRole;
          badge.className = 'text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full font-semibold uppercase bg-slate-800 text-slate-400 border border-slate-700';
          if (dbBtn) dbBtn.classList.add('hidden');
        }
      } else {
        menu.classList.add('hidden');
        if (dbBtn) dbBtn.classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const errorBox = document.getElementById('auth-error');

      if (!supabaseClient) {
        errorBox.innerText = i18n[currentLang].noDbWarning;
        errorBox.classList.remove('hidden');
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorBox.innerText = error.message;
        errorBox.classList.remove('hidden');
      } else {
        checkAuthStatus();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const errorBox = document.getElementById('auth-error');
      const successBox = document.getElementById('auth-success');

      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      if (!supabaseClient) {
        errorBox.innerText = i18n[currentLang].noDbWarning;
        errorBox.classList.remove('hidden');
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name: name } }
      });

      if (error) {
        errorBox.innerText = error.message;
        errorBox.classList.add('hidden');
      } else {
        if (data.user) {
          await supabaseClient.from('profiles').upsert({
            id: data.user.id,
            email: email,
            full_name: name,
            role: 'student'
          });
        }
        successBox.innerText = currentLang === 'kk' ? "Сәтті! Жүйеге кірудеміз..." : "Успешно! Входим в систему...";
        successBox.classList.remove('hidden');
        setTimeout(() => checkAuthStatus(), 1000);
      }
    }

    function openResetModal() { document.getElementById('reset-password-modal').classList.remove('hidden'); }
    function closeResetModal() { document.getElementById('reset-password-modal').classList.add('hidden'); }

    async function handleResetPassword() {
      const email = document.getElementById('reset-email').value.trim();
      const msg = document.getElementById('reset-msg');
      if (!email) return;

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });

      msg.classList.remove('hidden');
      if (error) {
        msg.className = "text-xs mb-4 p-3 rounded-lg bg-red-950/50 text-red-400 border border-red-900/50";
        msg.innerText = error.message;
      } else {
        msg.className = "text-xs mb-4 p-3 rounded-lg bg-green-950/50 text-green-400 border border-green-900/50";
        msg.innerText = currentLang === 'kk' ? "Құпиясөзді қалпына келтіру сілтемесі поштаңызға жіберілді!" : "Инструкция по сбросу пароля отправлена на вашу почту!";

              ${currentCourseLessons.map((l, idx) => {
                const lCompleted = !!userProgressMap[l.id];
                const isCurrent = l.id === activeLesson.id;
                return `
                  <div class="p-3 rounded-xl custom-input border ${isCurrent ? 'border-blue-500/80 bg-blue-950/20' : 'hover:border-blue-500/50'} transition flex items-center justify-between group">
                    <div class="cursor-pointer flex items-center gap-2.5 flex-grow mr-2 min-w-0" onclick="switchActiveLesson('${l.id}', '${courseId}')">
                      <i class="fa-solid ${lCompleted ? 'fa-circle-check text-green-400 text-sm' : 'fa-circle text-slate-500 text-xs'} flex-shrink-0"></i>
                      <span class="text-xs sm:text-sm font-medium ${lCompleted ? 'custom-sub line-through' : ''} truncate">${idx + 1}. ${l.title}</span>
                    </div>
                    <div class="flex items-center space-x-1.5 flex-shrink-0">
                      ${userRole === 'admin' ? `
                        <button onclick="editLessonPrompt('${l.id}', '${courseId}')" class="custom-sub hover:text-yellow-400 p-1" title="Редактировать">
                          <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteLesson('${l.id}', '${courseId}')" class="custom-sub hover:text-red-400 p-1" title="Удалить">
                          <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function switchActiveLesson(lessonId, courseId) {
      // ИСПРАВЛЕНИЕ: запоминаем выбранный урок в состоянии навигации
      navigationState.lessonId = lessonId;
      const lesson = currentCourseLessons.find(l => l.id === lessonId);
      if (lesson) {
        renderLessonDetailsView(lesson, courseId, document.getElementById('app-content'));
      }
    }

    async function toggleLessonProgress(lessonId, courseId) {
      const currentStatus = !!userProgressMap[lessonId];
      const newStatus = !currentStatus;

      userProgressMap[lessonId] = newStatus;

      await supabaseClient.from('lesson_progress').upsert({
        user_id: currentUser.id,
        lesson_id: lessonId,
        completed: newStatus
      }, { onConflict: 'user_id,lesson_id' });

      switchActiveLesson(lessonId, courseId);
    }

    function getEmbedUrl(url) {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length == 11) ? `https://www.youtube-nocookie.com/embed/${match[2]}` : null;
      }
      if (url.includes('drive.google.com')) return url.replace(/\/view.*$/, '/preview');
      return null;
    }

    async function editCoursePrompt(courseId) {
      const course = currentCoursesList.find(c => c.id === courseId);
      if (!course) return;

      const title = prompt("Название курса:", course.title);
      if (title === null) return;
      const description = prompt("Описание курса:", course.description || '');
      if (description === null) return;
      const cover_url = prompt("Ссылка на обложку (URL):", course.cover_url || '');

      await supabaseClient.from('courses').update({ title, description, cover_url }).eq('id', courseId);
      renderCoursesView();
    }

    async function createCoursePrompt() {
      const title = prompt("Название курса:");
      if (!title) return;
      const description = prompt("Описание:");
      const cover_url = prompt("Ссылка на обложку (URL):");

      await supabaseClient.from('courses').insert([{ title, description, cover_url }]);
      renderCoursesView();
    }

    async function deleteCourse(id) {
      if (confirm("Удалить этот курс?")) {
        await supabaseClient.from('courses').delete().eq('id', id);
        renderCoursesView();
      }
    }

    async function openStudentsModal() {
      const list = document.getElementById('students-list-container');
      list.innerHTML = `<div class="text-center py-6 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>`;
      document.getElementById('students-modal').classList.remove('hidden');

      const { data: students } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('role', 'student')
        .order('created_at', { ascending: false });

      allStudentsData = students || [];
      renderFilteredStudents(allStudentsData);
    }

    function filterStudentsList() {
      const query = document.getElementById('student-search-input').value.toLowerCase().trim();
      const filtered = allStudentsData.filter(s => 
        (s.full_name && s.full_name.toLowerCase().includes(query)) || 
        (s.email && s.email.toLowerCase().includes(query))
      );
      renderFilteredStudents(filtered);
    }

    async function renderFilteredStudents(students) {
      const list = document.getElementById('students-list-container');
      if (!students || students.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-slate-500">Ученики не найдены.</div>`;
        return;
      }

      const { data: courses } = await supabaseClient.from('courses').select('id, title');
      const { data: allAccess } = await supabaseClient.from('course_access').select('*');

      list.innerHTML = students.map(s => {
        const studentAccesses = allAccess ? allAccess.filter(a => a.user_id === s.id) : [];
        
        return `
          <div class="p-4 custom-input border rounded-xl space-y-3">
            <div>
              <div class="text-sm font-bold">${s.full_name || 'Без имени'}</div>
              <div class="text-xs custom-sub">${s.email || ''}</div>
            </div>
            
            <div class="pt-2 border-t border-slate-700/50">
              <div class="text-xs font-semibold mb-2">Доступ к курсам:</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${courses && courses.length > 0 ? courses.map(c => {
                  const access = studentAccesses.find(a => a.course_id === c.id);
                  const isActive = access && (!access.expires_at || new Date(access.expires_at) > new Date());
                  const expireStr = (access && access.expires_at) ? ` до ${new Date(access.expires_at).toLocaleDateString()}` : (isActive ? ' (Бессрочно)' : '');
                  
                  return `
                    <div class="flex items-center justify-between custom-card px-3 py-2 rounded-lg border text-xs">
                      <span class="truncate mr-2 font-medium" title="${c.title}">${c.title}</span>
                      <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="${isActive ? 'text-green-400' : 'text-slate-500'} font-semibold">${isActive ? 'Активен' + expireStr : 'Закрыт'}</span>
                        <button onclick="toggleCourseAccess('${s.id}', '${c.id}', ${isActive})" class="px-2 py-1 rounded text-[11px] font-bold ${isActive ? 'bg-red-600/20 text-red-400 hover:bg-red-600/30' : 'bg-green-600 text-white hover:bg-green-500'}">
                          ${isActive ? 'Закрыть' : 'Открыть'}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('') : '<div class="text-xs text-slate-500">Нет доступных курсов</div>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleCourseAccess(studentId, courseId, currentActive) {
      if (currentActive) {
        await supabaseClient.from('course_access').delete().match({ user_id: studentId, course_id: courseId });
      } else {
        const choice = prompt("Выберите срок доступа к этому курсу:\n1 - 1 месяц\n3 - 3 месяца\n6 - 6 месяцев\n12 - 12 месяцев\n0 или пусто - Без ограничений", "6");
        if (choice === null) return;

        let months = parseInt(choice);
        let expiresAt = null;

        if (!isNaN(months) && months > 0) {
          let date = new Date();
          date.setMonth(date.getMonth() + months);
          expiresAt = date.toISOString();
        }

        await supabaseClient.from('course_access').upsert({
          user_id: studentId,
          course_id: courseId,
          expires_at: expiresAt
        }, { onConflict: 'user_id,course_id' });
      }
      openStudentsModal();
    }

    function closeStudentsModal() { document.getElementById('students-modal').classList.add('hidden'); }

    // ИСПРАВЛЕНИЕ #3: Безопасное прикрепление файлов с перехватом ошибки Supabase
    async function addLessonPrompt(courseId) {
      const title = prompt("Название урока:");
      if (!title) return;
      const video_url = prompt("Ссылка на видео (YouTube / Drive / MP4):");
      if (!video_url) return;
      const description = prompt("Описание урока:");
      
      const file_name = prompt("Название прикрепляемого файла / документа (необязательно, например: Инструкция.pdf):");
      let attachments = [];
      if (file_name) {
        const file_url = prompt("Ссылка на файл (Google Drive / прямая ссылка):");
        if (file_url) {
          attachments.push({ name: file_name, url: file_url });
        }
      }

      let lessonData = { course_id: courseId, title, video_url, description };
      if (attachments.length > 0) {
         lessonData.attachments = attachments;
      }

      const { error } = await supabaseClient.from('lessons').insert([lessonData]);
      if (error) {
         // Перехват ошибки, если колонки attachments нет в БД
         if (error.message.includes('attachments')) {
             alert('Внимание! В базе данных Supabase (таблица "lessons") нет колонки "attachments". Видеоурок сейчас будет сохранен БЕЗ файла.\n\nЧтобы файлы заработали, зайдите в Supabase и создайте колонку "attachments" с типом данных "JSONB".');
             delete lessonData.attachments;
             await supabaseClient.from('lessons').insert([lessonData]);
         } else {
             alert("Ошибка при сохранении: " + error.message);
         }
      }
      openCourse(courseId, false);
    }

    async function editLessonPrompt(lessonId, courseId) {
      const lesson = currentCourseLessons.find(l => l.id === lessonId);
      if (!lesson) return;

      const title = prompt("Название урока:", lesson.title);
      if (title === null) return;
      const video_url = prompt("Ссылка на видео:", lesson.video_url);
      if (video_url === null) return;
      const description = prompt("Описание урока:", lesson.description || '');

      let existingFile = (lesson.attachments && lesson.attachments[0]) ? lesson.attachments[0] : {};
      const file_name = prompt("Название прикрепляемого файла / документа (необязательно):", existingFile.name || '');
      let attachments = [];
      if (file_name) {
        const file_url = prompt("Ссылка на файл:", existingFile.url || '');
        if (file_url) {
          attachments.push({ name: file_name, url: file_url });
        }
      }

      let lessonData = { title, video_url, description };
      if (attachments.length > 0 || lesson.attachments) {
         lessonData.attachments = attachments;
      }

      const { error } = await supabaseClient.from('lessons').update(lessonData).eq('id', lessonId);
      if (error) {
         if (error.message.includes('attachments')) {
             alert('Внимание! В базе данных Supabase (таблица "lessons") нет колонки "attachments". Видеоурок обновлен БЕЗ файла.\n\nЧтобы файлы заработали, зайдите в Supabase и создайте колонку "attachments" с типом данных "JSONB".');
             delete lessonData.attachments;
             await supabaseClient.from('lessons').update(lessonData).eq('id', lessonId);
         } else {
             alert("Ошибка при сохранении: " + error.message);
         }
      }
      openCourse(courseId, false);
    }

    async function deleteLesson(lessonId, courseId) {
      if (confirm("Удалить этот урок?")) {
        await supabaseClient.from('lessons').delete().eq('id', lessonId);
        openCourse(courseId, false);
      }
    }

    function openProfileModal() {
      document.getElementById('profile-email').value = currentUser?.email || '';
      document.getElementById('profile-fullname').value = userFullName || '';
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

    async function saveProfile() {
      const fullName = document.getElementById('profile-fullname').value.trim();
      if (!fullName) return;

      await supabaseClient.from('profiles').upsert({
        id: currentUser.id,
        email: currentUser.email,
        full_name: fullName,
        role: userRole
      });

      userFullName = fullName;
      updateUserMenu(fullName);
      closeProfileModal();
    }

    function openConfigModal() { 
      document.getElementById('supabase-url').value = localStorage.getItem('supabase_url') || DEFAULT_SUPABASE_URL;
      document.getElementById('supabase-key').value = localStorage.getItem('supabase_key') || DEFAULT_SUPABASE_KEY;
      document.getElementById('config-modal').classList.remove('hidden'); 
    }
    function closeConfigModal() { document.getElementById('config-modal').classList.add('hidden'); }
    
    async function saveSupabaseConfig() {
      const url = document.getElementById('supabase-url').value.trim();
      const key = document.getElementById('supabase-key').value.trim();
      localStorage.setItem('supabase_url', url);
      localStorage.setItem('supabase_key', key);
      closeConfigModal();
      initSupabase();
    }

    function goHome() {
      if (currentUser) renderCoursesView(); else renderAuthView();
    }

    async function logout() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      currentUser = null;
      updateUserMenu(null);
      renderAuthView();
    }

    initTheme();
    updateLanguageUI();
    renderAuthView();
    initSupabase();
  </script>
</body>
</html>
