<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ахметтен пайдалы ақпарат - Оқыту платформасы</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glassmorphism {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Шапка сайта -->
  <header class="glassmorphism sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="handleLogoClick()">
        <!-- Постоянный логотип бренда -->
        <img id="brand-logo-img" src="https://p16-common-sign.tiktokcdn.com/tos-useast2a-avt-0068-euttp/6886f3ee61cf6662f1b894a66006e428~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=14579&refresh_token=9f2876a5&x-expires=1793988000&x-signature=XG44myIc7lHN9UYmLIEmy%2BKKWsE%3D&t=4d5b0474&ps=13740610&shp=a5d48078&shcp=81f88b70&idc=my2" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Ahmet';" alt="Ахмет" class="w-10 h-10 rounded-xl object-cover border border-blue-500/40 shadow-md shadow-blue-500/20">
        <div>
          <span class="text-base sm:text-lg font-bold text-white leading-tight block">Ахметтен пайдалы ақпарат</span>
          <span class="block text-[11px] text-blue-400 font-medium" id="lang-subtitle">Оқыту платформасы</span>
        </div>
      </div>

      <div class="flex items-center space-x-4">
        <!-- Переключатель языка -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-1 flex items-center text-xs font-semibold">
          <button onclick="setLanguage('ru')" id="lang-btn-ru" class="px-2.5 py-1 rounded-md transition-all">RU</button>
          <button onclick="setLanguage('kk')" id="lang-btn-kk" class="px-2.5 py-1 rounded-md transition-all">KK</button>
        </div>

        <!-- Кнопка настройки БД (Скрыта от учеников) -->
        <button id="db-config-btn" onclick="openConfigModal()" class="hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="Настройки Supabase">
          <i class="fa-solid fa-database"></i>
        </button>

        <!-- Профиль пользователя -->
        <div id="user-menu" class="hidden flex items-center space-x-3 border-l border-slate-800 pl-4">
          <button onclick="openProfileModal()" class="flex items-center space-x-2 hover:opacity-80 transition">
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm" id="user-avatar">A</div>
            <span class="text-sm font-medium text-slate-300" id="user-name">Пользователь</span>
            <span id="user-role-badge" class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase bg-slate-800 text-slate-400 border border-slate-700">Ученик</span>
          </button>
          <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800 transition" title="Выйти">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Главный контейнер -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8" id="app-content">
  </main>

  <!-- Модалка Профиля -->
  <div id="profile-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-blue-500"></i> <span id="txt-profile-title">Настройки профиля</span>
        </h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Email</label>
          <input type="text" id="profile-email" disabled class="w-full bg-slate-950 border border-slate-800 text-slate-500 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" id="txt-label-fullname">ФИО / Аты-жөні</label>
          <input type="text" id="profile-fullname" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeProfileModal()" class="px-4 py-2 text-sm text-slate-400">Отмена</button>
        <button onclick="saveProfile()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-500">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка Настроек БД -->
  <div id="config-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-database text-blue-500"></i> Настройки Supabase</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Project URL</label>
          <input type="text" id="supabase-url" placeholder="https://xyz.supabase.co" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Anon / Public Key</label>
          <textarea id="supabase-key" rows="3" placeholder="eyJhbGciOi..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white font-mono"></textarea>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeConfigModal()" class="px-4 py-2 text-sm text-slate-400">Отмена</button>
        <button onclick="saveSupabaseConfig()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_SUPABASE_URL = 'https://qnjddzjvjfoogubmzynn.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuamRkemp2amZvb2d1Ym16eW5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MDgxNzMsImV4cCI6MjEwOTM4NDE3M30.ELwDRdG5mWblCsQurRDfXcbruY-UuZcXcdEMzkCEKno';

    const i18n = {
      ru: {
        subtitle: "Обучающая платформа",
        loginTab: "Вход",
        registerTab: "Регистрация",
        emailLabel: "Электронная почта",
        passwordLabel: "Пароль",
        nameLabel: "Ваше имя / ФИО",
        loginBtn: "Войти",
        registerBtn: "Зарегистрироваться",
        myCourses: "Мои Обучения",
        adminPanel: "Панель Администратора",
        createCourse: "Создать курс",
        addLesson: "Добавить урок",
        backToCourses: "← Назад к списку курсов",
        profileTitle: "Настройки профиля",
        fullName: "ФИО / Ваше имя",
        adminRole: "АДМИН",
        studentRole: "УЧЕНИК",
        deleteCourse: "Удалить курс",
        noCourses: "Курсы еще не созданы.",
        noLessons: "В этом курсе пока нет уроков.",
        noDbWarning: "Ошибка подключения к базе данных."
      },
      kk: {
        subtitle: "Оқыту платформасы",
        loginTab: "Кіру",
        registerTab: "Тіркелу",
        emailLabel: "Электрондық пошта",
        passwordLabel: "Құпиясөз",
        nameLabel: "Аты-жөніңіз",
        loginBtn: "Кіру",
        registerBtn: "Тіркелу",
        myCourses: "Менің Оқуларым",
        adminPanel: "Әкімші Панелі",
        createCourse: "Курс құру",
        addLesson: "Сабақ қосу",
        backToCourses: "← Курстар тізіміне қайту",
        profileTitle: "Профиль баптаулары",
        fullName: "Аты-жөніңіз",
        adminRole: "ӘКІМШІ",
        studentRole: "ОҚУШЫ",
        deleteCourse: "Курсты жою",
        noCourses: "Курстар әлі жасалмаған.",
        noLessons: "Бұл курста әлі сабақтар жоқ.",
        noDbWarning: "Дерекқорға қосылу қатесі."
      }
    };

    let currentLang = localStorage.getItem('lms_lang') || 'ru';
    let authTab = 'login';
    let supabaseClient = null;
    let currentUser = null;
    let userRole = 'student';
    let userFullName = '';
    let currentCourseLessons = [];

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lms_lang', lang);
      updateLanguageUI();
      if (currentUser) renderCoursesView(); else renderAuthView();
    }

    function updateLanguageUI() {
      document.getElementById('lang-subtitle').innerText = i18n[currentLang].subtitle;
      document.getElementById('lang-btn-ru').className = currentLang === 'ru' ? 'px-2.5 py-1 rounded-md bg-blue-600 text-white' : 'px-2.5 py-1 rounded-md text-slate-400 hover:text-white';
      document.getElementById('lang-btn-kk').className = currentLang === 'kk' ? 'px-2.5 py-1 rounded-md bg-blue-600 text-white' : 'px-2.5 py-1 rounded-md text-slate-400 hover:text-white';
      document.getElementById('txt-profile-title').innerText = i18n[currentLang].profileTitle;
      document.getElementById('txt-label-fullname').innerText = i18n[currentLang].fullName;
    }

    function switchAuthTab(tab) {
      authTab = tab;
      renderAuthView();
    }

    function renderAuthView() {
      const app = document.getElementById('app-content');
      app.innerHTML = `
        <div class="max-w-md mx-auto mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
          <div class="flex border-b border-slate-800 mb-6">
            <button onclick="switchAuthTab('login')" class="w-1/2 py-3 text-sm font-semibold border-b-2 transition ${authTab === 'login' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-white'}">
              ${i18n[currentLang].loginTab}
            </button>
            <button onclick="switchAuthTab('register')" class="w-1/2 py-3 text-sm font-semibold border-b-2 transition ${authTab === 'register' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-white'}">
              ${i18n[currentLang].registerTab}
            </button>
          </div>

          <form onsubmit="${authTab === 'login' ? 'handleLogin(event)' : 'handleRegister(event)'}" class="space-y-4">
            ${authTab === 'register' ? `
              <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">${i18n[currentLang].nameLabel}</label>
                <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
              </div>
            ` : ''}

            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">${i18n[currentLang].emailLabel}</label>
              <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">${i18n[currentLang].passwordLabel}</label>
              <input type="password" id="auth-password" required minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div id="auth-error" class="text-red-400 text-xs hidden bg-red-950/50 p-3 rounded-lg border border-red-900/50"></div>
            <div id="auth-success" class="text-green-400 text-xs hidden bg-green-950/50 p-3 rounded-lg border border-green-900/50"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/30">
              ${authTab === 'login' ? i18n[currentLang].loginBtn : i18n[currentLang].registerBtn}
            </button>
          </form>
        </div>
      `;
    }

    function initSupabase() {
      const url = localStorage.getItem('supabase_url') || DEFAULT_SUPABASE_URL;
      const key = localStorage.getItem('supabase_key') || DEFAULT_SUPABASE_KEY;

      if (url && key && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(url, key);
          checkAuthStatus();
        } catch (e) {
          console.error("Supabase init error:", e);
        }
      }
    }

    async function checkAuthStatus() {
      if (!supabaseClient) return;

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentUser = session.user;
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('role, full_name')
            .eq('id', currentUser.id)
            .maybeSingle();

          userRole = profile?.role || 'student';
          userFullName = profile?.full_name || currentUser.email.split('@')[0];
          updateUserMenu(userFullName);
          renderCoursesView();
        } else {
          currentUser = null;
          updateUserMenu(null);
          renderAuthView();
        }
      } catch(err) {
        console.error("Auth check failed:", err);
      }
    }

    function updateUserMenu(name) {
      const menu = document.getElementById('user-menu');
      const dbBtn = document.getElementById('db-config-btn');

      if (name) {
        menu.classList.remove('hidden');
        document.getElementById('user-name').innerText = name;
        document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
        
        const badge = document.getElementById('user-role-badge');
        if (userRole === 'admin') {
          badge.innerText = i18n[currentLang].adminRole;
          badge.className = 'text-[10px] px-2 py-0.5 rounded-full font-bold uppercase bg-blue-600/20 text-blue-400 border border-blue-500/40';
          if (dbBtn) dbBtn.classList.remove('hidden');
        } else {
          badge.innerText = i18n[currentLang].studentRole;
          badge.className = 'text-[10px] px-2 py-0.5 rounded-full font-semibold uppercase bg-slate-800 text-slate-400 border border-slate-700';
          if (dbBtn) dbBtn.classList.add('hidden');
        }
      } else {
        menu.classList.add('hidden');
        if (dbBtn) dbBtn.classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const errorBox = document.getElementById('auth-error');

      if (!supabaseClient) {
        errorBox.innerText = i18n[currentLang].noDbWarning;
        errorBox.classList.remove('hidden');
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorBox.innerText = error.message;
        errorBox.classList.remove('hidden');
      } else {
        checkAuthStatus();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const errorBox = document.getElementById('auth-error');
      const successBox = document.getElementById('auth-success');

      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      if (!supabaseClient) {
        errorBox.innerText = i18n[currentLang].noDbWarning;
        errorBox.classList.remove('hidden');
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name }
        }
      });

      if (error) {
        errorBox.innerText = error.message;
        errorBox.classList.remove('hidden');
      } else {
        successBox.innerText = "Успешно! Входим в систему...";
        successBox.classList.remove('hidden');
        setTimeout(() => checkAuthStatus(), 1000);
      }
    }

    async function renderCoursesView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `<div class="text-center py-12 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>`;

      const { data: courses } = await supabaseClient.from('courses').select('*').order('created_at', { ascending: false });

      let html = `
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-2xl font-bold text-white">${userRole === 'admin' ? i18n[currentLang].adminPanel : i18n[currentLang].myCourses}</h1>
          ${userRole === 'admin' ? `
            <button onclick="createCoursePrompt()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> ${i18n[currentLang].createCourse}
            </button>
          ` : ''}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      `;

      if (courses && courses.length > 0) {
        courses.forEach(c => {
          html += `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition flex flex-col justify-between p-5 relative group">
              <div>
                <div class="h-36 bg-slate-800 rounded-xl mb-4 overflow-hidden relative">
                  <img src="${c.cover_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800'}" class="w-full h-full object-cover">
                </div>
                <h3 class="text-lg font-bold text-white">${c.title}</h3>
                <p class="text-xs text-slate-400 mt-2 line-clamp-2">${c.description || ''}</p>
              </div>

              <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between">
                <button onclick="openCourse('${c.id}')" class="text-xs font-semibold text-blue-400 hover:text-blue-300 flex items-center gap-1">
                  Смотреть уроки <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
                ${userRole === 'admin' ? `
                  <button onclick="deleteCourse('${c.id}')" class="text-xs text-red-400 hover:text-red-300 p-1" title="${i18n[currentLang].deleteCourse}">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        });
      } else {
        html += `<div class="col-span-full text-center py-12 text-slate-500">${i18n[currentLang].noCourses}</div>`;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    async function openCourse(courseId) {
      const container = document.getElementById('app-content');
      container.innerHTML = `<div class="text-center py-12 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>`;

      const { data: lessons } = await supabaseClient.from('lessons').select('*').eq('course_id', courseId).order('position', { ascending: true });
      currentCourseLessons = lessons || [];

      let html = `
        <div class="flex justify-between items-center mb-6">
          <button onclick="renderCoursesView()" class="text-sm text-slate-400 hover:text-white inline-flex items-center gap-2">
            ${i18n[currentLang].backToCourses}
          </button>
          ${userRole === 'admin' ? `
            <button onclick="addLessonPrompt('${courseId}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> ${i18n[currentLang].addLesson}
            </button>
          ` : ''}
        </div>
      `;

      if (!lessons || lessons.length === 0) {
        html += `<div class="text-center py-12 text-slate-500">${i18n[currentLang].noLessons}</div>`;
        container.innerHTML = html;
        return;
      }

      const activeLesson = lessons[0];
      const embedUrl = getEmbedUrl(activeLesson.video_url);

      html += `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 space-y-4">
            <div class="bg-black rounded-2xl overflow-hidden aspect-video border border-slate-800 shadow-2xl relative">
              ${embedUrl ? `<iframe src="${embedUrl}" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>` : 
                `<video src="${activeLesson.video_url}" controls class="w-full h-full"></video>`}
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
              <h2 class="text-xl font-bold text-white" id="current-lesson-title">${activeLesson.title}</h2>
              <p class="text-sm text-slate-400 mt-2" id="current-lesson-desc">${activeLesson.description || ''}</p>
            </div>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 h-fit">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 px-2">Список уроков</h3>
            <div class="space-y-2">
              ${lessons.map((l, idx) => `
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800/60 hover:border-blue-500/50 transition flex items-center justify-between group">
                  <div class="cursor-pointer flex-grow mr-2" onclick="playLesson('${l.id}')">
                    <span class="text-sm font-medium text-slate-200">${idx + 1}. ${l.title}</span>
                  </div>
                  <div class="flex items-center space-x-2">
                    <button onclick="playLesson('${l.id}')" class="text-blue-500 hover:text-blue-400 p-1" title="Смотреть">
                      <i class="fa-solid fa-play text-xs"></i>
                    </button>
                    ${userRole === 'admin' ? `
                      <button onclick="editLessonPrompt('${l.id}', '${courseId}')" class="text-slate-400 hover:text-yellow-400 p-1" title="Редактировать">
                        <i class="fa-solid fa-pen text-xs"></i>
                      </button>
                      <button onclick="deleteLesson('${l.id}', '${courseId}')" class="text-slate-400 hover:text-red-400 p-1" title="Удалить урок">
                        <i class="fa-solid fa-trash text-xs"></i>
                      </button>
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function playLesson(lessonId) {
      const lesson = currentCourseLessons.find(l => l.id === lessonId);
      if (!lesson) return;

      const embedUrl = getEmbedUrl(lesson.video_url);
      const playerBox = document.querySelector('.aspect-video');
      if (playerBox) {
        playerBox.innerHTML = embedUrl ? `<iframe src="${embedUrl}" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>` : `<video src="${lesson.video_url}" controls class="w-full h-full"></video>`;
      }

      document.getElementById('current-lesson-title').innerText = lesson.title;
      document.getElementById('current-lesson-desc').innerText = lesson.description || '';
    }

    function getEmbedUrl(url) {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length == 11) ? `https://www.youtube-nocookie.com/embed/${match[2]}` : null;
      }
      if (url.includes('drive.google.com')) return url.replace(/\/view.*$/, '/preview');
      return null;
    }

    async function createCoursePrompt() {
      const title = prompt("Название курса:");
      if (!title) return;
      const description = prompt("Описание:");
      const cover_url = prompt("Ссылка на обложку (URL):");

      await supabaseClient.from('courses').insert([{ title, description, cover_url }]);
      renderCoursesView();
    }

    async function deleteCourse(id) {
      if (confirm("Удалить этот курс?")) {
        await supabaseClient.from('courses').delete().eq('id', id);
        renderCoursesView();
      }
    }

    async function addLessonPrompt(courseId) {
      const title = prompt("Название урока:");
      if (!title) return;
      const video_url = prompt("Ссылка на видео (YouTube / Drive / MP4):");
      if (!video_url) return;
      const description = prompt("Описание урока:");

      await supabaseClient.from('lessons').insert([{ course_id: courseId, title, video_url, description }]);
      openCourse(courseId);
    }

    async function editLessonPrompt(lessonId, courseId) {
      const lesson = currentCourseLessons.find(l => l.id === lessonId);
      if (!lesson) return;

      const title = prompt("Название урока:", lesson.title);
      if (title === null) return;
      const video_url = prompt("Ссылка на видео:", lesson.video_url);
      if (video_url === null) return;
      const description = prompt("Описание урока:", lesson.description || '');

      await supabaseClient.from('lessons').update({ title, video_url, description }).eq('id', lessonId);
      openCourse(courseId);
    }

    async function deleteLesson(lessonId, courseId) {
      if (confirm("Удалить этот урок?")) {
        await supabaseClient.from('lessons').delete().eq('id', lessonId);
        openCourse(courseId);
      }
    }

    function openProfileModal() {
      document.getElementById('profile-email').value = currentUser?.email || '';
      document.getElementById('profile-fullname').value = userFullName || '';
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

    async function saveProfile() {
      const fullName = document.getElementById('profile-fullname').value.trim();
      if (!fullName) return;

      await supabaseClient.from('profiles').upsert({
        id: currentUser.id,
        email: currentUser.email,
        full_name: fullName,
        role: userRole
      });

      userFullName = fullName;
      updateUserMenu(fullName);
      closeProfileModal();
    }

    function openConfigModal() { 
      document.getElementById('supabase-url').value = localStorage.getItem('supabase_url') || DEFAULT_SUPABASE_URL;
      document.getElementById('supabase-key').value = localStorage.getItem('supabase_key') || DEFAULT_SUPABASE_KEY;
      document.getElementById('config-modal').classList.remove('hidden'); 
    }
    function closeConfigModal() { document.getElementById('config-modal').classList.add('hidden'); }
    
    function saveSupabaseConfig() {
      const url = document.getElementById('supabase-url').value.trim();
      const key = document.getElementById('supabase-key').value.trim();
      localStorage.setItem('supabase_url', url);
      localStorage.setItem('supabase_key', key);
      closeConfigModal();
      initSupabase();
    }

    function handleLogoClick() {
      if (currentUser) renderCoursesView(); else renderAuthView();
    }

    async function logout() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      currentUser = null;
      updateUserMenu(null);
      renderAuthView();
    }

    updateLanguageUI();
    renderAuthView();
    initSupabase();
  </script>
</body>
</html>
