      -webkit-user-select: none;

      -ms-user-select: none;
      user-select: none;

</head>

        <div class="min-w-0">
          <span class="text-sm sm:text-base font-bold text-white leading-tight block truncate">Ахметтен пайдалы ақпарат</span>
          <span class="block text-[10px] sm:text-[11px] text-blue-400 font-medium truncate" id="lang-subtitle">Оқыту платформасы</span>
        </div>
      </div>

      <!-- Правый блок -->
      <div class="flex items-center space-x-2 sm:space-x-3 ml-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-0.5 sm:p-1 flex items-center text-[11px] sm:text-xs font-semibold">
          <button onclick="setLanguage('ru')" id="lang-btn-ru" class="px-2 py-0.5 sm:py-1 rounded-md transition-all">RU</button>
          <button onclick="setLanguage('kk')" id="lang-btn-kk" class="px-2 py-0.5 sm:py-1 rounded-md transition-all">KK</button>
        </div>

        <button id="db-config-btn" onclick="openConfigModal()" class="hidden p-1.5 sm:p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="Настройки">
          <i class="fa-solid fa-database text-xs sm:text-sm"></i>
        </button>

        <div id="user-menu" class="hidden flex items-center space-x-2 border-l border-slate-800 pl-2 sm:pl-3">
          <button onclick="openProfileModal()" class="flex items-center space-x-1.5 hover:opacity-80 transition max-w-[120px] sm:max-w-none">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs sm:text-sm flex-shrink-0" id="user-avatar">A</div>
            <span class="text-xs sm:text-sm font-medium text-slate-300 truncate hidden sm:inline" id="user-name">Пользователь</span>
            <span id="user-role-badge" class="text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full font-bold uppercase bg-slate-800 text-slate-400 border border-slate-700">Ученик</span>
          </button>
          <button onclick="logout()" class="p-1.5 sm:p-2 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800 transition" title="Выйти">
            <i class="fa-solid fa-right-from-bracket text-xs sm:text-sm"></i>
          </button>
        </div>

    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6" id="app-content">
  </main>

  <div id="profile-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-blue-500"></i> <span id="txt-profile-title">Настройки профиля</span>
        </h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">

          <label class="block text-xs text-slate-400 mb-1">Email</label>

        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1" id="txt-label-fullname">ФИО / Аты-жөні</label>
          <input type="text" id="profile-fullname" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">

      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeProfileModal()" class="px-4 py-2 text-sm text-slate-400">Отмена</button>
        <button onclick="saveProfile()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-500">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="students-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-users text-blue-500"></i> <span>Управление учениками</span>
        </h3>
        <button onclick="closeStudentsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="mb-4">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="student-search-input" oninput="filterStudentsList()" placeholder="Поиск по имени или email..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="overflow-y-auto flex-grow space-y-3 pr-1" id="students-list-container">
      </div>
    </div>
  </div>

  <div id="reset-password-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">Сброс пароля</h3>
        <button onclick="closeResetModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs text-slate-400 mb-4">Введите ваш Email, и мы отправим ссылку для сброса пароля.</p>
      <input type="email" id="reset-email" placeholder="email@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white mb-4 focus:outline-none focus:border-blue-500">
      <div id="reset-msg" class="text-xs hidden mb-4 p-3 rounded-lg"></div>
      <div class="flex justify-end gap-3">
        <button onclick="closeResetModal()" class="px-4 py-2 text-sm text-slate-400">Отмена</button>
        <button onclick="handleResetPassword()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-500">Отправить</button>
      </div>
    </div>
  </div>

  <div id="config-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-database text-blue-500"></i> Настройки Supabase</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Project URL</label>
          <input type="text" id="supabase-url" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Anon / Public Key</label>
          <textarea id="supabase-key" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white font-mono"></textarea>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeConfigModal()" class="px-4 py-2 text-sm text-slate-400">Отмена</button>
        <button onclick="saveSupabaseConfig()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_SUPABASE_URL = 'https://qnjddzjvjfoogubmzynn.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuamRkemp2amZvb2d1Ym16eW5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MDgxNzMsImV4cCI6MjEwOTM4NDE3M30.ELwDRdG5mWblCsQurRDfXcbruY-UuZcXcdEMzkCEKno';

    const i18n = {
      ru: {
        subtitle: "Оқыту платформасы",
        loginTab: "Вход",
        registerTab: "Регистрация",
        emailLabel: "Электронная почта",

        loginBtn: "Войти",

        myCourses: "Мои Обучения",
        adminPanel: "Панель Администратора",
        createCourse: "Создать курс",
        addLesson: "Добавить урок",
        backToCourses: "← Назад к списку курсов",
        profileTitle: "Настройки профиля",
        fullName: "ФИО / Ваше имя",
        adminRole: "АДМИН",
        studentRole: "УЧЕНИК",
        deleteCourse: "Удалить курс",
        editCourse: "Редактировать курс",
        noCourses: "Курсы еще не созданы.",
        noLessons: "В этом курсе пока нет уроков.",
        noAccessTitle: "Доступ еще не активирован",
        noAccessText: "Ваш аккаунт успешно зарегистрирован! Доступ к урокам откроется после подтверждения оплаты.",
        whatsappBtn: "Написать Администратору в WhatsApp",
        noDbWarning: "Ошибка подключения к базе данных."
      },
      kk: {
        subtitle: "Оқыту платформасы",
        loginTab: "Кіру",
        registerTab: "Тіркелу",
        emailLabel: "Электрондық пошта",
        passwordLabel: "Құпиясөз",
        nameLabel: "Аты-жөніңіз",
        loginBtn: "Кіру",
        registerBtn: "Тіркелу",
        forgotPass: "Құпиясөзді ұмыттыңыз ба?",
        myCourses: "Менің Оқуларым",
        adminPanel: "Әкімші Панелі",
        createCourse: "Курс құру",
        addLesson: "Сабақ қосу",
        backToCourses: "← Курстар тізіміне қайту",
        profileTitle: "Профиль баптаулары",
        fullName: "Аты-жөніңіз",
        adminRole: "ӘКІМШІ",
        studentRole: "ОҚУШЫ",
        deleteCourse: "Курсты жою",
        editCourse: "Курсты өңдеу",
        noCourses: "Курстар әлі жасалмаған.",
        noLessons: "Бұл курста әлі сабақтар жоқ.",
        noAccessTitle: "Қолжетімділік әлі белсендірілмеген",
        noAccessText: "Тіркелуіңіз сәтті өтті! Сабақтарға рұқсат алу үшін төлемді растау қажет.",
        whatsappBtn: "Әкімшіге WhatsApp-қа жазу",
        noDbWarning: "Дерекқорға қосылу қатесі."
      }
    };

    let currentLang = localStorage.getItem('lms_lang') || 'ru';
    let authTab = 'login';
    let supabaseClient = null;
    let currentUser = null;
    let userRole = 'student';
    let userIsActive = false;
    let userFullName = '';
    let currentCourseLessons = [];
    let currentCoursesList = [];
    let userProgressMap = {};
    let allStudentsData = [];

    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey && (e.key === 's' || e.key === 'u')) || e.key === 'F12') {
        e.preventDefault();
      }
    });

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lms_lang', lang);
      updateLanguageUI();
      if (currentUser) renderCoursesView(); else renderAuthView();
    }

    function updateLanguageUI() {
      document.getElementById('lang-subtitle').innerText = i18n[currentLang].subtitle;
      document.getElementById('lang-btn-ru').className = currentLang === 'ru' ? 'px-2 py-0.5 sm:py-1 rounded-md bg-blue-600 text-white' : 'px-2 py-0.5 sm:py-1 rounded-md text-slate-400 hover:text-white';
      document.getElementById('lang-btn-kk').className = currentLang === 'kk' ? 'px-2 py-0.5 sm:py-1 rounded-md bg-blue-600 text-white' : 'px-2 py-0.5 sm:py-1 rounded-md text-slate-400 hover:text-white';
      document.getElementById('txt-profile-title').innerText = i18n[currentLang].profileTitle;
      document.getElementById('txt-label-fullname').innerText = i18n[currentLang].fullName;
    }

    function switchAuthTab(tab) {
      authTab = tab;
      renderAuthView();
    }

    function renderAuthView() {
      const app = document.getElementById('app-content');
      app.innerHTML = `
        <div class="max-w-md mx-auto mt-4 sm:mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
          <div class="flex border-b border-slate-800 mb-6">
            <button onclick="switchAuthTab('login')" class="w-1/2 py-3 text-sm font-semibold border-b-2 transition ${authTab === 'login' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-white'}">
              ${i18n[currentLang].loginTab}
            </button>
            <button onclick="switchAuthTab('register')" class="w-1/2 py-3 text-sm font-semibold border-b-2 transition ${authTab === 'register' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-white'}">
              ${i18n[currentLang].registerTab}
            </button>
          </div>

          <form onsubmit="${authTab === 'login' ? 'handleLogin(event)' : 'handleRegister(event)'}" class="space-y-4">
            ${authTab === 'register' ? `
              <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">${i18n[currentLang].nameLabel}</label>
                <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
              </div>
            ` : ''}

            <div>
              <label class="block text-xs uppercase text-slate-400 mb-1">${i18n[currentLang].emailLabel}</label>
              <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-xs uppercase text-slate-400">${i18n[currentLang].passwordLabel}</label>
                ${authTab === 'login' ? `<button type="button" onclick="openResetModal()" class="text-[11px] text-blue-400 hover:underline">${i18n[currentLang].forgotPass}</button>` : ''}
              </div>
              <input type="password" id="auth-password" required minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div id="auth-error" class="text-red-400 text-xs hidden bg-red-950/50 p-3 rounded-lg border border-red-900/50"></div>
            <div id="auth-success" class="text-green-400 text-xs hidden bg-green-950/50 p-3 rounded-lg border border-green-900/50"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/30">
              ${authTab === 'login' ? i18n[currentLang].loginBtn : i18n[currentLang].registerBtn}
            </button>
          </form>
        </div>
      `;
    }

    function initSupabase() {
      const url = localStorage.getItem('supabase_url') || DEFAULT_SUPABASE_URL;
      const key = localStorage.getItem('supabase_key') || DEFAULT_SUPABASE_KEY;

      if (url && key && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(url, key);
          checkAuthStatus();
        } catch (e) {
          console.error("Supabase init error:", e);
        }
      }
    }

    async function checkAuthStatus() {
      if (!supabaseClient) return;

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentUser = session.user;
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('role, full_name, is_active')
            .eq('id', currentUser.id)
            .maybeSingle();

          userRole = profile?.role || 'student';
          userIsActive = profile?.is_active ?? (userRole === 'admin');
          userFullName = profile?.full_name || currentUser.email.split('@')[0];
          
          await loadUserProgress();
          updateUserMenu(userFullName);
          renderCoursesView();
        } else {
          currentUser = null;
          updateUserMenu(null);
          renderAuthView();
        }
      } catch(err) {
        console.error("Auth check failed:", err);
      }
    }

    async function loadUserProgress() {
      if (!currentUser || !supabaseClient) return;
      const { data } = await supabaseClient
        .from('lesson_progress')
        .select('lesson_id, completed')
        .eq('user_id', currentUser.id);

      userProgressMap = {};
      if (data) {
        data.forEach(p => { if (p.completed) userProgressMap[p.lesson_id] = true; });
      }
    }

    function updateUserMenu(name) {
      const menu = document.getElementById('user-menu');
      const dbBtn = document.getElementById('db-config-btn');

      if (name) {
        menu.classList.remove('hidden');
        document.getElementById('user-name').innerText = name;
        document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
        
        const badge = document.getElementById('user-role-badge');
        if (userRole === 'admin') {
          badge.innerText = i18n[currentLang].adminRole;
          badge.className = 'text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full font-bold uppercase bg-blue-600/20 text-blue-400 border border-blue-500/40';
          if (dbBtn) dbBtn.classList.remove('hidden');
        } else {
          badge.innerText = i18n[currentLang].studentRole;
          badge.className = 'text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full font-semibold uppercase bg-slate-800 text-slate-400 border border-slate-700';
          if (dbBtn) dbBtn.classList.add('hidden');
        }
      } else {
        menu.classList.add('hidden');
        if (dbBtn) dbBtn.classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const errorBox = document.getElementById('auth-error');

      if (!supabaseClient) {
        errorBox.innerText = i18n[currentLang].noDbWarning;
        errorBox.classList.remove('hidden');
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorBox.innerText = error.message;
        errorBox.classList.remove('hidden');
      } else {
        checkAuthStatus();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const errorBox = document.getElementById('auth-error');
      const successBox = document.getElementById('auth-success');

      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      if (!supabaseClient) {
        errorBox.innerText = i18n[currentLang].noDbWarning;
        errorBox.classList.remove('hidden');
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name: name } }
      });

      if (error) {
        errorBox.innerText = error.message;
        errorBox.classList.remove('hidden');
      } else {
        if (data.user) {
          await supabaseClient.from('profiles').upsert({
            id: data.user.id,
            email: email,
            full_name: name,
            role: 'student',
            is_active: false
          });
        }
        successBox.innerText = "Успешно! Входим в систему...";
        successBox.classList.remove('hidden');
        setTimeout(() => checkAuthStatus(), 1000);
      }
    }

    function openResetModal() { document.getElementById('reset-password-modal').classList.remove('hidden'); }
    function closeResetModal() { document.getElementById('reset-password-modal').classList.add('hidden'); }

    async function handleResetPassword() {
      const email = document.getElementById('reset-email').value.trim();
      const msg = document.getElementById('reset-msg');
      if (!email) return;

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href,
      });

      msg.classList.remove('hidden');
      if (error) {

    async function toggleLessonProgress(lessonId, courseId) {
      const currentStatus = !!userProgressMap[lessonId];
      const newStatus = !currentStatus;

      userProgressMap[lessonId] = newStatus;

      await supabaseClient.from('lesson_progress').upsert({
        user_id: currentUser.id,
        lesson_id: lessonId,
        completed: newStatus
      }, { onConflict: 'user_id,lesson_id' });

      switchActiveLesson(lessonId, courseId);
    }

    function downloadCertificate(courseTitle) {
      const canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 800;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 12;
      ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.strokeRect(45, 45, canvas.width - 90, canvas.height - 90);

      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 36px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('СЕРТИФИКАТ ОБ ОКОНЧАНИИ', canvas.width / 2, 160);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '20px Inter, sans-serif';
      ctx.fillText('Настоящий сертификат подтверждает, что', canvas.width / 2, 230);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px Inter, sans-serif';
      ctx.fillText(userFullName.toUpperCase(), canvas.width / 2, 320);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '20px Inter, sans-serif';
      ctx.fillText('успешно завершил(а) обучение по курсу:', canvas.width / 2, 400);

      ctx.fillStyle = '#60a5fa';
      ctx.font = 'bold 36px Inter, sans-serif';
      ctx.fillText(`«${courseTitle}»`, canvas.width / 2, 480);

      const today = new Date().toLocaleDateString('ru-RU');
      ctx.fillStyle = '#64748b';
      ctx.font = '18px Inter, sans-serif';
      ctx.fillText(`Дата выдачи: ${today}`, 250, 680);
      ctx.fillText('Платформа: Ахметтен пайдалы ақпарат', canvas.width - 300, 680);

      const link = document.createElement('a');
      link.download = `Certificate_${userFullName}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function getEmbedUrl(url) {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length == 11) ? `https://www.youtube-nocookie.com/embed/${match[2]}` : null;
      }
      if (url.includes('drive.google.com')) return url.replace(/\/view.*$/, '/preview');
      return null;
    }

    function saveSupabaseConfig() {
      const url = document.getElementById('supabase-url').value.trim();
      const key = document.getElementById('supabase-key').value.trim();
      localStorage.setItem('supabase_url', url);
      localStorage.setItem('supabase_key', key);
      closeConfigModal();
      initSupabase();
    }

    function handleLogoClick() {
      if (currentUser) renderCoursesView(); else renderAuthView();
    }

    async function logout() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      currentUser = null;
      updateUserMenu(null);
      renderAuthView();
    }

    updateLanguageUI();
    renderAuthView();
    initSupabase();
  </script>
</body>
</html>
