<!DOCTYPE html>
<html lang="ru" id="html-root">

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    .theme-dark {
      background-color: #030712;
      color: #f1f5f9;
    }
    .theme-dark .glassmorphism {
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .theme-dark .custom-card {
      background-color: #0f172a;
      border-color: #1e293b;
    }
    .theme-dark .custom-input {
      background-color: #020617;
      border-color: #1e293b;
      color: #ffffff;
    }
    .theme-dark .custom-sub {
      color: #94a3b8;
    }

    .theme-light {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .theme-light .glassmorphism {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .theme-light .custom-card {
      background-color: #ffffff;
      border-color: #e2e8f0;
    }
    .theme-light .custom-input {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    .theme-light .custom-sub {
      color: #64748b;
    }

    .no-select {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    /* Hide only Netlify UI: do not match YouTube iframe src, whose origin parameter includes netlify.app. */
    iframe[src^="https://app.netlify.com/"], iframe[id*="netlify"], div[style*="z-index: 2147483647"], a[href*="netlify.com/support"] {
      display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; width: 0 !important; height: 0 !important;
    }
    .course-pricing { margin-top: 14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .course-old-price { color:#f87171; text-decoration:line-through; font-weight:700; }
    .course-discount { color:#fff; background:#dc2626; padding:3px 8px; border-radius:8px; font-size:12px; font-weight:700; }
    .course-final-price { color:#4ade80; font-size:22px; font-weight:800; width:100%; }
    .custom-player { position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; }
    .custom-player iframe,.custom-player video { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .player-click-shield { position:absolute; inset:0; z-index:2; background:transparent; }
    .player-controls { position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex; gap:9px; align-items:center; padding:12px; background:linear-gradient(transparent,rgba(0,0,0,.92)); color:white; }
    .player-controls button { min-width:30px; padding:5px; cursor:pointer; }
    .player-controls input[type=range] { flex:1; min-width:35px; accent-color:#3b82f6; }
    .player-controls .player-time { font-size:11px; white-space:nowrap; }
    .custom-player:fullscreen { width:100vw; height:100vh; aspect-ratio:auto; }
    @media(max-width:440px) { .player-controls {gap:3px;padding:6px;} .player-controls button {min-width:25px;padding:3px;} .player-controls .player-time {font-size:9px;} }
  </style>
</head>
<body class="theme-dark min-h-screen flex flex-col no-select transition-colors duration-300" oncontextmenu="return false;">

  <!-- Шапка -->
  <header class="glassmorphism sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2 sm:py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center space-x-2.5 cursor-pointer min-w-0" onclick="goHome()">
        <img src="https://p16-common-sign.tiktokcdn.com/tos-useast2a-avt-0068-euttp/6886f3ee61cf6662f1b894a66006e428~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=14579&refresh_token=9f2876a5&x-expires=1793988000&x-signature=XG44myIc7lHN9UYmLIEmy%2BKKWsE%3D&t=4d5b0474&ps=13740610&shp=a5d48078&shcp=81f88b70&idc=my2" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Ahmet';" alt="Ахмет" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl object-cover border border-blue-500/40 shadow-md shadow-blue-500/20 flex-shrink-0">
        <div class="min-w-0">
          <span class="text-sm sm:text-base font-bold leading-tight block truncate">Ахметтен пайдалы ақпарат</span>
          <span class="block text-[10px] sm:text-[11px] text-blue-500 font-medium truncate" id="lang-subtitle">Платформа обучения</span>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3 ml-auto">
        <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800/40 hover:bg-slate-800/70 border border-slate-700/50 text-slate-300 transition" title="Сменить тему">
          <i id="theme-icon" class="fa-solid fa-moon text-xs sm:text-sm"></i>
        </button>

        <div class="bg-slate-900 border border-slate-800 rounded-lg p-0.5 sm:p-1 flex items-center text-[11px] sm:text-xs font-semibold">
          <button onclick="setLanguage('ru')" id="lang-btn-ru" class="px-2 py-0.5 sm:py-1 rounded-md transition-all">RU</button>
          <button onclick="setLanguage('kk')" id="lang-btn-kk" class="px-2 py-0.5 sm:py-1 rounded-md transition-all">KK</button>
        </div>

        <button id="db-config-btn" onclick="openConfigModal()" class="p-1.5 sm:p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition" title="Настройки БД">
          <i class="fa-solid fa-database text-xs sm:text-sm"></i>
        </button>

        <div id="user-menu" class="hidden flex items-center space-x-2 border-l border-slate-800 pl-2 sm:pl-3">
          <button onclick="openProfileModal()" class="flex items-center space-x-1.5 hover:opacity-80 transition max-w-[120px] sm:max-w-none">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs sm:text-sm flex-shrink-0" id="user-avatar">A</div>
            <span class="text-xs sm:text-sm font-medium truncate hidden sm:inline" id="user-name">Пользователь</span>
            <span id="user-role-badge" class="text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded-full font-bold uppercase bg-slate-800 text-slate-400 border border-slate-700">Ученик</span>
          </button>
          <button onclick="logout()" class="p-1.5 sm:p-2 text-slate-400 hover:text-red-400 rounded-lg hover:bg-slate-800 transition" title="Выйти">
            <i class="fa-solid fa-right-from-bracket text-xs sm:text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6" id="app-content">
  </main>

  <!-- Профиль -->
  <div id="profile-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="custom-card border rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-blue-500"></i> <span id="txt-profile-title">Настройки профиля</span>
        </h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs custom-sub mb-1">Email</label>
          <input type="text" id="profile-email" disabled class="w-full custom-input rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs custom-sub mb-1" id="txt-label-fullname">ФИО / Аты-жөні</label>
          <input type="text" id="profile-fullname" class="w-full custom-input rounded-lg px-3 py-2 text-sm">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeProfileModal()" class="px-4 py-2 text-sm custom-sub" id="txt-cancel">Отмена</button>
        <button onclick="saveProfile()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-500" id="txt-save">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Ученики -->
  <div id="students-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="custom-card border rounded-2xl max-w-3xl w-full p-6 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-users text-blue-500"></i> <span id="txt-students-title">Управление учениками и доступами</span>
        </h3>
        <button onclick="closeStudentsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="mb-4">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="student-search-input" oninput="filterStudentsList()" placeholder="Поиск по имени или email..." class="w-full custom-input rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="overflow-y-auto flex-grow space-y-3 pr-1" id="students-list-container">
      </div>
    </div>
  </div>

  <!-- Сброс пароля -->
  <div id="reset-password-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="custom-card border rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold" id="txt-reset-title">Сброс пароля</h3>
        <button onclick="closeResetModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs custom-sub mb-4" id="txt-reset-desc">Введите ваш Email, и мы отправим ссылку для сброса пароля.</p>
      <input type="email" id="reset-email" placeholder="email@example.com" class="w-full custom-input rounded-xl px-4 py-3 text-sm mb-4 focus:outline-none focus:border-blue-500">
      <div id="reset-msg" class="text-xs hidden mb-4 p-3 rounded-lg"></div>
      <div class="flex justify-end gap-3">
        <button onclick="closeResetModal()" class="px-4 py-2 text-sm custom-sub" id="txt-reset-cancel">Отмена</button>
        <button onclick="handleResetPassword()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-500" id="txt-reset-send">Отправить</button>
      </div>
    </div>
  </div>

  <!-- Конфигурация Supabase -->
  <div id="config-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="custom-card border rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold mb-4"><i class="fa-solid fa-database text-blue-500"></i> Настройки Supabase</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs custom-sub mb-1">Project URL</label>
          <input type="text" id="supabase-url" class="w-full custom-input rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs custom-sub mb-1">Anon / Public Key</label>
          <textarea id="supabase-key" rows="3" class="w-full custom-input rounded-lg px-3 py-2 text-xs font-mono"></textarea>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeConfigModal()" class="px-4 py-2 text-sm custom-sub">Отмена</button>
        <button onclick="saveSupabaseConfig()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Редактор курсов и стоимости: доступ только администраторам -->
  <div id="course-editor-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] hidden items-center justify-center p-3 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="course-editor-heading">

      <div class="flex justify-between items-start gap-3 mb-5">

        </div>
        <button type="button" onclick="closeCourseEditor()" aria-label="Закрыть" class="p-2 rounded-lg hover:bg-slate-700"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="course-editor-form" onsubmit="saveCourseEditor(event)" class="space-y-4">
        <div id="course-editor-details" class="space-y-4">
          <div>
            <label for="course-editor-title" class="block text-xs font-semibold mb-1" id="label-course-title">Название курса</label>
            <input id="course-editor-title" type="text" maxlength="200" required class="w-full custom-input border rounded-xl px-4 py-3 text-sm" placeholder="Название курса">
          </div>
          <div>
            <label for="course-editor-description-field" class="block text-xs font-semibold mb-1" id="label-course-description">Описание</label>
            <textarea id="course-editor-description-field" rows="3" class="w-full custom-input border rounded-xl px-4 py-3 text-sm" placeholder="Описание курса"></textarea>
          </div>
          <div>
            <label for="course-editor-cover" class="block text-xs font-semibold mb-1" id="label-course-cover">Ссылка на обложку (необязательно)</label>
            <input id="course-editor-cover" type="url" class="w-full custom-input border rounded-xl px-4 py-3 text-sm" placeholder="https://...">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="course-editor-price" id="label-course-price" class="block text-xs font-semibold mb-1">Цена курса, ₸</label>
            <input id="course-editor-price" type="number" min="0" max="999999999999" step="1" required inputmode="numeric" oninput="updateCourseEditorPreview()" class="w-full custom-input border rounded-xl px-4 py-3 text-base font-bold" placeholder="50000">
          </div>
          <div>
            <label for="course-editor-discount" id="label-course-discount" class="block text-xs font-semibold mb-1">Скидка, %</label>
            <input id="course-editor-discount" type="number" min="0" max="100" step="0.01" required inputmode="decimal" oninput="updateCourseEditorPreview()" class="w-full custom-input border rounded-xl px-4 py-3 text-base font-bold" placeholder="30">
          </div>
        </div>
        <div class="rounded-xl border border-slate-700/60 p-4 bg-slate-900/40">
          <div id="course-editor-preview-label" class="text-xs custom-sub mb-2">Как увидят цену ученики</div>
          <div id="course-editor-preview" aria-live="polite"><span class="text-xs custom-sub">Введите цену и скидку</span></div>
        </div>
        <div id="course-editor-error" role="alert" class="hidden rounded-xl p-3 text-xs text-red-400 bg-red-950/40 border border-red-800/50"></div>
        <div class="flex justify-end gap-3 pt-2">
          <button id="course-editor-cancel" type="button" onclick="closeCourseEditor()" class="px-4 py-2.5 text-sm custom-sub">Отмена</button>
          <button id="course-editor-save" type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2.5 rounded-xl text-sm">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

    async function saveCourseEditor(event) {
      event.preventDefault();
      if (userRole !== 'admin' || !currentUser || !supabaseClient) return;
      const priceInput = document.getElementById('course-editor-price');
      const discountInput = document.getElementById('course-editor-discount');

    function loadYouTubeApi() {
      if (window.YT?.Player) return Promise.resolve();
      if (ytApiPromise) return ytApiPromise;
      ytApiPromise = new Promise((resolve,reject) => {
        const previous = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => { if (typeof previous === 'function') previous(); resolve(); };
        const script = document.createElement('script'); script.src='https://www.youtube.com/iframe_api';
        script.onerror=()=>reject(new Error('Не удалось загрузить YouTube API'));
        document.head.appendChild(script);
      });
      return ytApiPromise;
    }
    function extractYouTubeId(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.toLowerCase();
        if (host === 'youtu.be' || host === 'www.youtu.be') return /^[-_a-zA-Z0-9]{11}$/.test(u.pathname.slice(1).split('/')[0]) ? u.pathname.slice(1).split('/')[0] : null;
        if (!['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)) return null;
        const id = u.searchParams.get('v') || (u.pathname.match(/^\/(?:embed|shorts|live)\/([-_a-zA-Z0-9]{11})/) || [])[1];
        return /^[-_a-zA-Z0-9]{11}$/.test(id || '') ? id : null;
      } catch { return null; }
    }
    function disposePlayer() { if (activePlayer?.timer) clearInterval(activePlayer.timer); if (activePlayer?.yt?.destroy) try { activePlayer.yt.destroy(); } catch {} activePlayer=null; }
    function playerAction(action) {
      const p=activePlayer; if (!p) return;
      if (action==='fullscreen') { const el=document.getElementById('course-player'); if (!el) return; if(document.fullscreenElement) document.exitFullscreen?.(); else el.requestFullscreen?.(); return; }
      if (p.yt) { if(action==='toggle') { const state=p.yt.getPlayerState(); state===1?p.yt.pauseVideo():p.yt.playVideo(); } else if(action==='back'||action==='forward') p.yt.seekTo(Math.max(0,p.yt.getCurrentTime()+(action==='back'?-10:10)),true); }
      if (p.video) { if(action==='toggle') p.video.paused?p.video.play():p.video.pause(); else if(action==='back'||action==='forward') p.video.currentTime=Math.max(0,p.video.currentTime+(action==='back'?-10:10)); }
    }
    function playerSeek(value) { const p=activePlayer; if(!p)return; const duration=p.yt?.getDuration?.()||p.video?.duration||0; if(p.yt) p.yt.seekTo(duration*value/100,true); else if(p.video) p.video.currentTime=duration*value/100; }
    function playerTime(seconds) { seconds=Math.floor(Number(seconds)||0); return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`; }
    async function initCoursePlayer(videoUrl) {
      disposePlayer(); const el=document.getElementById('course-player'); if(!el)return;
      const id=extractYouTubeId(videoUrl); const p={}; activePlayer=p;
      const seek=el.querySelector('#player-seek'), time=el.querySelector('#player-time'), toggle=el.querySelector('#player-toggle');
      if(id) {
        try { await loadYouTubeApi(); if(activePlayer!==p||!document.getElementById('youtube-player-target'))return;
          p.yt=new YT.Player('youtube-player-target',{videoId:id,playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,playsinline:1,iv_load_policy:3,origin:location.origin},events:{onStateChange:()=>{if(toggle)toggle.innerHTML=p.yt.getPlayerState()===1?'❚❚':'▶';}}});
        } catch(err) { el.querySelector('.player-click-shield').textContent='Ошибка загрузки YouTube'; }
      } else { p.video=el.querySelector('video'); if(p.video) p.video.addEventListener('play',()=>toggle.innerHTML='❚❚'); if(p.video) p.video.addEventListener('pause',()=>toggle.innerHTML='▶'); }
      p.timer=setInterval(()=>{if(activePlayer!==p)return;const duration=p.yt?.getDuration?.()||p.video?.duration||0;const current=p.yt?.getCurrentTime?.()||p.video?.currentTime||0;if(seek&&document.activeElement!==seek)seek.value=duration?100*current/duration:0;if(time)time.textContent=`${playerTime(current)} / ${playerTime(duration)}`;},400);
    }
    function renderVideoPlayer(url) {
      const youtubeId=extractYouTubeId(url);
      const source=youtubeId?'<div id="youtube-player-target"></div>':`<video playsinline preload="metadata" src="${escapeHtml(url||'')}"></video>`;
      return `<div class="custom-player rounded-2xl border border-slate-800 shadow-2xl" id="course-player">${source}<div class="player-click-shield" aria-hidden="true"></div><div class="player-controls"><button onclick="playerAction('toggle')" id="player-toggle" aria-label="Воспроизвести или поставить на паузу">▶</button><button onclick="playerAction('back')" aria-label="Назад на 10 секунд">↶10</button><button onclick="playerAction('forward')" aria-label="Вперёд на 10 секунд">10↷</button><input id="player-seek" aria-label="Перемотка" type="range" min="0" max="100" value="0" step="0.1" oninput="playerSeek(Number(this.value))"><span id="player-time" class="player-time">0:00 / 0:00</span><button onclick="playerAction('fullscreen')" aria-label="На весь экран">⛶</button></div></div>`;

      if (url && key && window.supabase) {

        } catch (e) {
          console.error("Supabase init error:", e);
        }

    async function checkAuthStatus() {
      if (!supabaseClient) return;

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          currentUser = session.user;
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('role, full_name')
            .eq('id', currentUser.id)
            .maybeSingle();

          let dbRole = profile?.role;
          
          if (currentUser.email === 'ahmet.erkynov@gmail.com') {
              dbRole = 'admin';
          }

          userRole = dbRole || 'student';
          userFullName = profile?.full_name || currentUser.email.split('@')[0];

          await loadUserAccess();
          await loadUserProgress();
          updateUserMenu(userFullName);
          
          renderCoursesView();
        } else {
          currentUser = null;
          updateUserMenu(null);
          renderAuthView();
        }
      } catch(err) {
        console.error("Auth check failed:", err);
      }
    }

    async function loadUserAccess() {
      if (!currentUser || !supabaseClient) return;
      userCourseAccessMap = {};
      if (userRole === 'admin') return;

      const { data } = await supabaseClient
        .from('course_access')
        .select('course_id, expires_at')
        .eq('user_id', currentUser.id);

      if (data) {
        const now = new Date();
        data.forEach(acc => {
          if (!acc.expires_at || new Date(acc.expires_at) > now) {
            userCourseAccessMap[acc.course_id] = acc.expires_at;
          }
        });
      }
    }

    async function loadUserProgress() {
      if (!currentUser || !supabaseClient) return;
      const { data } = await supabaseClient
        .from('lesson_progress')
        .select('lesson_id, completed')
        .eq('user_id', currentUser.id);

      userProgressMap = {};
      if (data) {
        data.forEach(p => { if (p.completed) userProgressMap[p.lesson_id] = true; });
      }

    // Стабильная сортировка: заданный администратором порядок, затем номер в названии
    // для старых записей с одинаковой позицией (часто 0), затем дата создания.
    function lessonNumberFromTitle(title) {
      const match = String(title || '').match(/^\s*(\d{1,4})\s*[-–.)]?\s*(?:сабақ|урок|lesson)(?=\s|[.:-]|$)/iu);
      return match ? Number(match[1]) : null;
    }

    function orderedCourseLessons(lessons) {
      return [...lessons].sort((a, b) => {
        const positionA = Number(a.position ?? 0);
        const positionB = Number(b.position ?? 0);
        if (positionA !== positionB) return positionA - positionB;
        const numberA = lessonNumberFromTitle(a.title);
        const numberB = lessonNumberFromTitle(b.title);
        if (numberA !== null && numberB !== null && numberA !== numberB) return numberA - numberB;
        const dateA = a.created_at ? new Date(a.created_at).getTime() : NaN;
        const dateB = b.created_at ? new Date(b.created_at).getTime() : NaN;
        if (Number.isFinite(dateA) && Number.isFinite(dateB) && dateA !== dateB) return dateA - dateB;
        return String(a.id).localeCompare(String(b.id));
      });
    }

    let lessonOrderSaving = false;
    function lessonOrderMessage(ru, kk) { return currentLang === 'kk' ? kk : ru; }

    // Перенос урока на одну позицию вверх или вниз. Запоминаем порядок в Supabase.
    async function moveLesson(lessonId, courseId, direction) {
      if (userRole !== 'admin' || !currentUser || lessonOrderSaving || ![-1, 1].includes(direction)) return;
      const list = [...currentCourseLessons];
      const index = list.findIndex(l => l.id === lessonId);
      const neighborIndex = index + direction;
      if (index < 0 || neighborIndex < 0 || neighborIndex >= list.length) return;
      [list[index], list[neighborIndex]] = [list[neighborIndex], list[index]];
      await saveLessonOrder(courseId, list);
    }

    // Однократное восстановление хронологии старых уроков с названиями «1-САБАҚ», «2-САБАҚ»…
    async function arrangeLessonsByNumber(courseId) {
      if (userRole !== 'admin' || !currentUser || lessonOrderSaving) return;
      const current = [...currentCourseLessons];
      if (!current.some(lesson => lessonNumberFromTitle(lesson.title) !== null)) {
        alert(lessonOrderMessage('В названиях нет номеров в формате 1-САБАҚ или 1-УРОК. Можно использовать стрелки.', 'Атауларда 1-САБАҚ үлгісіндегі нөмір жоқ. Көрсеткілерді пайдаланыңыз.'));
        return;
      }
      const list = current.map((lesson, oldIndex) => ({ lesson, oldIndex }));
      list.sort((a, b) => {
        const na = lessonNumberFromTitle(a.lesson.title);
        const nb = lessonNumberFromTitle(b.lesson.title);
        if (na === null && nb === null) return a.oldIndex - b.oldIndex;
        if (na === null) return 1;
        if (nb === null) return -1;
        return na - nb || a.oldIndex - b.oldIndex;
      });
      await saveLessonOrder(courseId, list.map(item => item.lesson));
    }

    async function saveLessonOrder(courseId, lessons) {
      if (userRole !== 'admin' || !currentUser || !supabaseClient || lessonOrderSaving) return;
      // Не меняем список, если переданы лишние или отсутствующие уроки.
      if (lessons.length !== currentCourseLessons.length ||
          new Set(lessons.map(l => l.id)).size !== lessons.length ||
          lessons.some(l => !currentCourseLessons.find(c => c.id === l.id))) return;
      lessonOrderSaving = true;
      const buttons = document.querySelectorAll('[data-lesson-order-action]');
      buttons.forEach(button => button.disabled = true);
      try {
        for (let index = 0; index < lessons.length; index++) {
          const lesson = lessons[index];
          if (Number(lesson.position) === index + 1) continue;
          const {data, error} = await supabaseClient.from('lessons')
            .update({ position: index + 1 })
            .eq('id', lesson.id)
            .eq('course_id', courseId)
            .select('id');
          if (error) throw error;
          if (!data || !data.length) throw new Error(lessonOrderMessage('Supabase не подтвердил обновление: проверьте права администратора (RLS).', 'Supabase жаңартуды растамады: әкімші рұқсатын (RLS) тексеріңіз.'));
        }
        currentCourseLessons = lessons.map((lesson, index) => ({ ...lesson, position: index + 1 }));
        const listContainer = document.getElementById('lesson-list-items');
        if (listContainer) listContainer.innerHTML = renderLessonListItems(courseId, navigationState.lessonId);
        else await openCourse(courseId, false);
      } catch (err) {
        alert(lessonOrderMessage('Не удалось сохранить порядок уроков: ', 'Сабақтардың ретін сақтау мүмкін болмады: ') + (err.message || String(err)));
        await openCourse(courseId, false); // Перечитываем реальный порядок после ошибки
      } finally {
        lessonOrderSaving = false;
      }
    }

    function normalizeAttachmentList(value) {
      if (typeof value === 'string') {
        try { value = JSON.parse(value); } catch (e) { value = []; }
      }
      return Array.isArray(value) ? value.filter(item => item && typeof item === 'object') : [];
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function getAttachmentIcon(fileName) {
      const ext = String(fileName || '').split('.').pop().toLowerCase();
      if (ext === 'pdf') return 'fa-file-pdf text-red-400';
      if (['doc', 'docx'].includes(ext)) return 'fa-file-word text-blue-400';
      if (['xls', 'xlsx', 'csv'].includes(ext)) return 'fa-file-excel text-green-400';
      if (['ppt', 'pptx'].includes(ext)) return 'fa-file-powerpoint text-orange-400';
      if (['jpg', 'jpeg', 'png'].includes(ext)) return 'fa-file-image text-purple-400';
      return 'fa-file-lines text-blue-400';
    }

    async function renderLessonDetailsView(activeLesson, courseId, container) {
      disposePlayer();
      const isCompleted = !!userProgressMap[activeLesson.id];
      const attachmentsList = normalizeAttachmentList(activeLesson.attachments);
      const watermarkText = `Смотрит: ${userFullName} (${currentUser?.email || ''})`;

      // Files uploaded to the private Storage bucket are displayed through temporary signed URLs.
      const attachmentRows = await Promise.all(attachmentsList.map(async (file, index) => {
        let fileUrl = file.url || '';
        let linkError = false;

        if (file.path) {
          const bucket = file.bucket || LESSON_FILES_BUCKET;
          const { data, error } = await supabaseClient.storage
            .from(bucket)
            .createSignedUrl(file.path, 60 * 60);
          if (error || !data?.signedUrl) {
            linkError = true;
            console.error('Не удалось получить ссылку на файл:', error);
          } else {
            fileUrl = data.signedUrl;
          }
        }

        const name = escapeHtml(file.name || i18n[currentLang].downloadFile);
        const icon = getAttachmentIcon(file.name);
        const sizeLabel = file.size ? ` · ${(file.size / 1024 / 1024).toFixed(2)} МБ` : '';
        const linkContent = fileUrl && !linkError

    async function uploadLessonFiles(lessonId, courseId) {
      if (userRole !== 'admin' || !supabaseClient || !currentUser) {
        alert('Прикреплять файлы может только администратор.');
        return;
      }

      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.accept = '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.jpg,.jpeg,.png';
      input.onchange = async () => {
        const files = Array.from(input.files || []);
        if (!files.length) return;

        const allowed = new Set(['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','jpg','jpeg','png']);
        for (const file of files) {
          const ext = file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
          if (!allowed.has(ext)) {
            alert(`Формат файла «${file.name}» не поддерживается.`);
            return;
          }
          if (file.size > MAX_LESSON_FILE_SIZE) {
            alert(`Файл «${file.name}» превышает ограничение 25 МБ.`);
            return;
          }
        }

        const { data: lesson, error: loadError } = await supabaseClient
          .from('lessons').select('attachments').eq('id', lessonId).single();
        if (loadError) {
          alert('Не удалось прочитать вложения урока: ' + loadError.message + '\nПроверьте колонку attachments в таблице lessons.');
          return;
        }

        const attachments = normalizeAttachmentList(lesson.attachments);
        const uploadedPaths = [];
        const mimeByExt = {
          pdf: 'application/pdf', doc: 'application/msword',
          docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
          xls: 'application/vnd.ms-excel',
          xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          ppt: 'application/vnd.ms-powerpoint',
          pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
          txt: 'text/plain', csv: 'text/csv', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png'
        };

        try {
          for (const file of files) {
            const ext = file.name.split('.').pop().toLowerCase();
            const safeName = file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') || `file.${ext}`;
            const unique = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`;
            const path = `${courseId}/${lessonId}/${unique}_${safeName}`;
            const contentType = file.type || mimeByExt[ext] || 'application/octet-stream';
            const { error: uploadError } = await supabaseClient.storage
              .from(LESSON_FILES_BUCKET)
              .upload(path, file, { cacheControl: '3600', upsert: false, contentType });
            if (uploadError) throw uploadError;
            uploadedPaths.push(path);
            attachments.push({
              name: file.name,
              path,
              bucket: LESSON_FILES_BUCKET,
              size: file.size,
              type: contentType,
              uploaded_at: new Date().toISOString()
            });
          }

          const { error: saveError } = await supabaseClient
            .from('lessons').update({ attachments }).eq('id', lessonId);
          if (saveError) throw saveError;

          alert(`Успешно прикреплено файлов: ${files.length}.`);
          await openCourse(courseId, false);
        } catch (error) {
          if (uploadedPaths.length) {
            await supabaseClient.storage.from(LESSON_FILES_BUCKET).remove(uploadedPaths);
          }
          console.error('Ошибка прикрепления файлов:', error);
          alert('Не удалось прикрепить файл: ' + (error.message || error) + '\n\nПроверьте SQL-настройки колонки attachments, Storage bucket и политики доступа.');
        }
      };
      input.click();
    }

    async function removeLessonAttachment(lessonId, courseId, attachmentIndex) {
      if (userRole !== 'admin') return;
      if (!confirm('Удалить прикреплённый файл?')) return;

      const { data: lesson, error: loadError } = await supabaseClient
        .from('lessons').select('attachments').eq('id', lessonId).single();
      if (loadError) {
        alert('Не удалось прочитать вложения: ' + loadError.message);
        return;
      }

      const attachments = normalizeAttachmentList(lesson.attachments);
      const file = attachments[attachmentIndex];
      if (!file) return;

      if (file.path) {
        const { error: removeError } = await supabaseClient.storage
          .from(file.bucket || LESSON_FILES_BUCKET).remove([file.path]);
        if (removeError) {
          alert('Не удалось удалить файл из хранилища: ' + removeError.message);
          return;
        }
      }

      attachments.splice(attachmentIndex, 1);
      const { error: saveError } = await supabaseClient
        .from('lessons').update({ attachments }).eq('id', lessonId);
      if (saveError) {
        alert('Файл удалён из хранилища, но список вложений не обновлён: ' + saveError.message);
        return;
      }
      await openCourse(courseId, false);
    }

      navigationState.lessonId = lessonId;
      const lesson = currentCourseLessons.find(l => l.id === lessonId);

    async function toggleLessonProgress(lessonId, courseId) {
      const currentStatus = !!userProgressMap[lessonId];
      const newStatus = !currentStatus;

      userProgressMap[lessonId] = newStatus;

      await supabaseClient.from('lesson_progress').upsert({
        user_id: currentUser.id,
        lesson_id: lessonId,
        completed: newStatus
      }, { onConflict: 'user_id,lesson_id' });

      switchActiveLesson(lessonId, courseId);
    }

    function getEmbedUrl(url) {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
        return (match && match[2].length == 11) ? `https://www.youtube-nocookie.com/embed/${match[2]}` : null;
      }
      if (url.includes('drive.google.com')) return url.replace(/\/view.*$/, '/preview');
      return null;
    }

    async function openStudentsModal() {
      const list = document.getElementById('students-list-container');
      list.innerHTML = `<div class="text-center py-6 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>`;
      document.getElementById('students-modal').classList.remove('hidden');

      const { data: students, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        list.innerHTML = `<div class="text-center py-6 text-red-400">Ошибка: ${error.message}</div>`;
        return;
      }

      allStudentsData = students || [];
      renderFilteredStudents(allStudentsData);

    function filterStudentsList() {
      const query = document.getElementById('student-search-input').value.toLowerCase().trim();
      const filtered = allStudentsData.filter(s => 
        (s.full_name && s.full_name.toLowerCase().includes(query)) || 
        (s.email && s.email.toLowerCase().includes(query))
      );
      renderFilteredStudents(filtered);
    }

    async function renderFilteredStudents(students) {
      const list = document.getElementById('students-list-container');
      if (!students || students.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-slate-500">Ученики не найдены.</div>`;
        return;
      }

      const { data: courses } = await supabaseClient.from('courses').select('id, title');
      const { data: allAccess } = await supabaseClient.from('course_access').select('*');

      list.innerHTML = students.map(s => {
        const studentAccesses = allAccess ? allAccess.filter(a => a.user_id === s.id) : [];
        const isUserAdmin = s.role === 'admin';
        
        return `
          <div class="p-4 custom-input border rounded-xl space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <div class="text-sm font-bold">${s.full_name || 'Без имени'} ${isUserAdmin ? '<span class="text-blue-400 text-xs">(Админ)</span>' : ''}</div>
                <div class="text-xs custom-sub">${s.email || ''}</div>
              </div>
            </div>
            
            <div class="pt-2 border-t border-slate-700/50">
              <div class="text-xs font-semibold mb-2">Доступ к курсам:</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${courses && courses.length > 0 ? courses.map(c => {
                  const access = studentAccesses.find(a => a.course_id === c.id);
                  const isActive = access && (!access.expires_at || new Date(access.expires_at) > new Date());
                  const expireStr = (access && access.expires_at) ? ` до ${new Date(access.expires_at).toLocaleDateString()}` : (isActive ? ' (Бессрочно)' : '');
                  
                  return `
                    <div class="flex items-center justify-between custom-card px-3 py-2 rounded-lg border text-xs">
                      <span class="truncate mr-2 font-medium" title="${c.title}">${c.title}</span>
                      <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="${isActive ? 'text-green-400' : 'text-slate-500'} font-semibold">${isActive ? 'Активен' + expireStr : 'Закрыт'}</span>
                        <button onclick="toggleCourseAccess('${s.id}', '${c.id}', ${isActive})" class="px-2 py-1 rounded text-[11px] font-bold ${isActive ? 'bg-red-600/20 text-red-400 hover:bg-red-600/30' : 'bg-green-600 text-white hover:bg-green-500'}">
                          ${isActive ? 'Закрыть' : 'Открыть'}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('') : '<div class="text-xs text-slate-500">Нет доступных курсов</div>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleCourseAccess(studentId, courseId, currentActive) {
      if (currentActive) {
        await supabaseClient.from('course_access').delete().match({ user_id: studentId, course_id: courseId });
      } else {
        const choice = prompt("Выберите срок доступа к этому курсу:\n1 - 1 месяц\n3 - 3 месяца\n6 - 6 месяцев\n12 - 12 месяцев\n0 или пусто - Без ограничений", "6");
        if (choice === null) return;

        let months = parseInt(choice);
        let expiresAt = null;

        if (!isNaN(months) && months > 0) {
          let date = new Date();
          date.setMonth(date.getMonth() + months);
          expiresAt = date.toISOString();
        }

        await supabaseClient.from('course_access').upsert({
          user_id: studentId,
          course_id: courseId,
          expires_at: expiresAt
        }, { onConflict: 'user_id,course_id' });
      }
      openStudentsModal();
    }

    function closeStudentsModal() { document.getElementById('students-modal').classList.add('hidden'); }

    async function addLessonPrompt(courseId) {
      const title = prompt("Название урока:");
      if (!title || !title.trim()) return;
      const video_url = prompt("Ссылка на видео (YouTube / Drive / MP4):");
      if (!video_url || !video_url.trim()) return;
      const description = prompt("Описание урока:") || '';

      // Новому уроку автоматически назначаем позицию после последнего урока курса.
      // Читаем из базы, а не из текущего экрана, чтобы избежать устаревшей нумерации.
      const {data: positions, error: positionError} = await supabaseClient.from('lessons')
        .select('position').eq('course_id', courseId);
      if (positionError) {
        alert(lessonOrderMessage('Не удалось определить порядок уроков: ', 'Сабақтардың ретін анықтау мүмкін болмады: ') + positionError.message);
        return;
      }
      const nextPosition = (positions || []).reduce((max, row) => {
        const value = Number(row.position);
        return Number.isFinite(value) ? Math.max(max, value) : max;
      }, 0) + 1;

      const { error } = await supabaseClient.from('lessons').insert([{
        course_id: courseId,
        title: title.trim(),
        video_url: video_url.trim(),
        description,
        position: nextPosition
      }]);

      if (error) {
        alert("Ошибка при сохранении урока: " + error.message);
        return;
      }
      await openCourse(courseId, false);
    }

    async function editLessonPrompt(lessonId, courseId) {
      const lesson = currentCourseLessons.find(l => l.id === lessonId);
      if (!lesson) return;

      const title = prompt("Название урока:", lesson.title);
      if (title === null) return;
      const video_url = prompt("Ссылка на видео:", lesson.video_url || '');
      if (video_url === null) return;
      const description = prompt("Описание урока:", lesson.description || '');
      if (description === null) return;

      // Do not overwrite attachments while editing lesson title/video/description.
      const { error } = await supabaseClient.from('lessons').update({
        title: title.trim(),
        video_url: video_url.trim(),
        description
      }).eq('id', lessonId);

      if (error) {
        alert("Ошибка при обновлении урока: " + error.message);
        return;
      }
      await openCourse(courseId, false);
    }

    async function deleteLesson(lessonId, courseId) {
      if (!confirm("Удалить этот урок?")) return;
      const lesson = currentCourseLessons.find(l => l.id === lessonId);
      const storedFiles = normalizeAttachmentList(lesson?.attachments).filter(file => file.path);
      if (storedFiles.length) {
        const byBucket = {};
        storedFiles.forEach(file => {
          const bucket = file.bucket || LESSON_FILES_BUCKET;
          (byBucket[bucket] ||= []).push(file.path);
        });
        for (const [bucket, paths] of Object.entries(byBucket)) {
          const { error } = await supabaseClient.storage.from(bucket).remove(paths);
          if (error) {
            alert('Не удалось удалить прикреплённые файлы: ' + error.message);
            return;
          }
        }
      }
      const { error } = await supabaseClient.from('lessons').delete().eq('id', lessonId);
      if (error) {
        alert('Ошибка удаления урока: ' + error.message);
        return;
      }
      await openCourse(courseId, false);
    }
